<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="100%" height="170">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
    <style>
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes spinClockwise { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spinCounter { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
      @keyframes pulseDot { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
      .cursor { animation: blink 1s infinite; }
      .spin-cw { transform-origin: 750px 85px; animation: spinClockwise 16s linear infinite; }
      .spin-ccw { transform-origin: 750px 85px; animation: spinCounter 10s linear infinite; }
      .pulse-dot { animation: pulseDot 2s ease-in-out infinite; }
      .mono { font-family: 'Consolas', 'Courier New', 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="846" height="166" rx="10" fill="#070b14" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <rect x="3" y="3" width="844" height="164" rx="9" fill="url(#grid)" />

  <!-- Animated Scanner Bar -->
  <line x1="5" y1="0" x2="845" y2="0" stroke="url(#scanGrad)" stroke-width="1.5">
    <animate attributeName="y1" values="5;165;5" dur="5s" repeatCount="indefinite" />
    <animate attributeName="y2" values="5;165;5" dur="5s" repeatCount="indefinite" />
  </line>

  <!-- Top System Header Bar -->
  <g transform="translate(25, 28)">
    <circle cx="4" cy="-4" r="4" fill="#10b981" class="pulse-dot" />
    <text x="16" y="0" fill="#64748b" class="mono" font-size="10" font-weight="bold" letter-spacing="1.5">SYSTEM MONITOR // VIRTUAL MEMORY HOOK &amp; 3D PIPELINE</text>
    <rect x="540" y="-11" width="75" height="15" rx="3" fill="#1e293b" />
    <text x="548" y="0" fill="#38bdf8" class="mono" font-size="9" font-weight="bold">WIN32 x64</text>
  </g>

  <!-- Console Log Stream -->
  <g class="mono" font-size="12" transform="translate(25, 58)">
    <!-- Log Line 1 -->
    <text x="0" y="0">
      <tspan fill="#64748b">[</tspan><tspan fill="#38bdf8">0x00401000</tspan><tspan fill="#64748b">]</tspan>
      <tspan fill="#818cf8" font-weight="bold"> HOOK_TARGET  </tspan>
      <tspan fill="#94a3b8">-> Process Virtual Memory Attached [PID: 0x27F4]</tspan>
    </text>

    <!-- Log Line 2 -->
    <text x="0" y="24">
      <tspan fill="#64748b">[</tspan><tspan fill="#38bdf8">PTR_RESOLVE</tspan><tspan fill="#64748b">]</tspan>
      <tspan fill="#34d399" font-weight="bold"> SCAN_CHAIN   </tspan>
      <tspan fill="#94a3b8">-> Base + 0x14F8 -&gt; [RAX + 0x30] Dynamic Offset Locked</tspan>
    </text>

    <!-- Log Line 3 -->
    <text x="0" y="48">
      <tspan fill="#64748b">[</tspan><tspan fill="#38bdf8">MATH_ENGINE</tspan><tspan fill="#64748b">]</tspan>
      <tspan fill="#f472b6" font-weight="bold"> BLENDER_3D   </tspan>
      <tspan fill="#94a3b8">-> Isometric Mesh Projection: 4x4 Affine Matrix OK</tspan>
    </text>

    <!-- Log Line 4 -->
    <text x="0" y="72">
      <tspan fill="#64748b">[</tspan><tspan fill="#10b981">STATUS_OK  </tspan><tspan fill="#64748b">]</tspan>
      <tspan fill="#fbbf24" font-weight="bold"> READY        </tspan>
      <tspan fill="#cbd5e1">-> System Stable // Ready for Operations</tspan>
      <tspan fill="#38bdf8" class="cursor" font-weight="bold">_</tspan>
    </text>
  </g>

  <!-- 3D Wireframe Gimbal & Polyhedron (Right Side) -->
  <g id="hud-3d-module">
    <!-- Outer Gimbal Ring -->
    <circle cx="750" cy="85" r="52" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.7" class="spin-cw" />
    <!-- Inner Gimbal Ring -->
    <circle cx="750" cy="85" r="42" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 6" stroke-opacity="0.6" class="spin-ccw" />
    <circle cx="750" cy="85" r="32" fill="none" stroke="#c084fc" stroke-width="0.5" stroke-opacity="0.4" />

    <!-- Isometric Wireframe Cube in Center -->
    <g transform="translate(750, 85)">
      <!-- Top Face -->
      <polygon points="0,-20 18,-10 0,0 -18,-10" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2"/>
      <!-- Left Face -->
      <polygon points="-18,-10 0,0 0,20 -18,10" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-width="1.2"/>
      <!-- Right Face -->
      <polygon points="0,0 18,-10 18,10 0,20" fill="#c084fc" fill-opacity="0.18" stroke="#c084fc" stroke-width="1.2"/>
      
      <!-- Center Connecting Axes -->
      <line x1="0" y1="0" x2="0" y2="20" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.6"/>
      
      <!-- Glowing Vertices -->
      <circle cx="0" cy="-20" r="2" fill="#38bdf8" />
      <circle cx="18" cy="-10" r="2" fill="#38bdf8" />
      <circle cx="-18" cy="-10" r="2" fill="#38bdf8" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
      <circle cx="-18" cy="10" r="2" fill="#818cf8" />
      <circle cx="18" cy="10" r="2" fill="#c084fc" />
      <circle cx="0" cy="20" r="2" fill="#c084fc" />
    </g>
    
    <!-- Module Label below Gimbal -->
    <text x="750" y="152" fill="#64748b" class="mono" font-size="8.5" text-anchor="middle" letter-spacing="1">ISOMETRIC 3D</text>
  </g>
</svg>
