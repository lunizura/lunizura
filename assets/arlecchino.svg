<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="160" style="overflow: hidden; border-radius: 10px;">
  <defs>
    <!-- Card Clip Path -->
    <clipPath id="cardClip">
      <rect x="2" y="2" width="846" height="156" rx="10"/>
    </clipPath>

    <!-- Radiance & Iris Gradients -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1a3c" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#a3001a" stop-opacity="0.6"/>
      <stop offset="65%" stop-color="#3b020a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#070204" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="irisDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#040102"/>
      <stop offset="65%" stop-color="#120205"/>
      <stop offset="100%" stop-color="#42030d"/>
    </radialGradient>

    <linearGradient id="frameBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e42" stop-opacity="0.9"/>
      <stop offset="15%" stop-color="#4d040e" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ff2647" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#4d040e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff1e42" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Wing & Blade Gradients -->
    <linearGradient id="wingGradLeft" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff2642" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#b3001c" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#59000d" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a0003" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="wingGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2642" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#b3001c" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#59000d" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a0003" stop-opacity="0"/>
    </linearGradient>

    <!-- Cross Facet Gradients (3D Chiseled Razor Blade) -->
    <linearGradient id="bladeFacetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ff5c73"/>
      <stop offset="100%" stop-color="#c40022"/>
    </linearGradient>

    <linearGradient id="bladeFacetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e42"/>
      <stop offset="50%" stop-color="#8a0014"/>
      <stop offset="100%" stop-color="#380007"/>
    </linearGradient>

    <!-- Laser Beams -->
    <linearGradient id="laserGradLeft" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff2a4a"/>
      <stop offset="60%" stop-color="#990016"/>
      <stop offset="100%" stop-color="#2a0006" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="laserGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a4a"/>
      <stop offset="60%" stop-color="#990016"/>
      <stop offset="100%" stop-color="#2a0006" stop-opacity="0"/>
    </linearGradient>

    <!-- Vision Brass Gradient -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae8b2"/>
      <stop offset="50%" stop-color="#c99347"/>
      <stop offset="100%" stop-color="#6e4a18"/>
    </linearGradient>

    <!-- Harlequin Diamond Lattice Pattern -->
    <pattern id="harlequin" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 15,0 L 30,15 L 15,30 L 0,15 Z" fill="none" stroke="#ff1a38" stroke-width="0.65" stroke-opacity="0.04"/>
    </pattern>

    <!-- Filters -->
    <filter id="crimsonBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ==================== BACKGROUND & FRAME ==================== -->
  <g clip-path="url(#cardClip)">
    <rect x="2" y="2" width="846" height="156" fill="#070204"/>
    <rect x="2" y="2" width="846" height="156" fill="url(#harlequin)"/>

    <!-- Center Ambient Crimson Radiance -->
    <circle cx="425" cy="80" r="150" fill="url(#centerGlow)"/>

    <!-- Ambient Drifting Particles -->
    <g fill="#ff3355">
      <circle cx="210" cy="95" r="1.6">
        <animate attributeName="cy" values="95;55;95" dur="3.8s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="210;190;210" dur="3.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="330" cy="45" r="1.4">
        <animate attributeName="cy" values="45;20;45" dur="4.2s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="330;310;330" dur="4.2s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.2s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="520" cy="45" r="1.4">
        <animate attributeName="cy" values="45;20;45" dur="4.2s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="520;540;520" dur="4.2s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.2s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="640" cy="95" r="1.6">
        <animate attributeName="cy" values="95;55;95" dur="3.8s" begin="2.1s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="640;660;640" dur="3.8s" begin="2.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.8s" begin="2.1s" repeatCount="indefinite"/>
      </circle>
      <!-- Micro Cross Glints -->
      <g transform="translate(280, 115)">
        <polygon points="0,-3.5 1,-1 3.5,0 1,1 0,3.5 -1,1 -3.5,0 -1,-1" fill="#ff4d66">
          <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" repeatCount="indefinite"/>
        </polygon>
      </g>
      <g transform="translate(570, 115)">
        <polygon points="0,-3.5 1,-1 3.5,0 1,1 0,3.5 -1,1 -3.5,0 -1,-1" fill="#ff4d66">
          <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
        </polygon>
      </g>
    </g>

    <!-- ==================== HORIZONTAL BOND OF LIFE STRINGS & WING BLADES ==================== -->
    <!-- Left Wing Crescent Feathers -->
    <g filter="url(#subtleGlow)">
      <path d="M 370,80 Q 230,52 80,78 Q 220,96 370,82 Z" fill="url(#wingGradLeft)"/>
      <path d="M 368,80 Q 230,53 84,78" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.55"/>
      <path d="M 355,72 Q 235,32 125,48 Q 245,66 355,75 Z" fill="url(#wingGradLeft)" opacity="0.85"/>
      <path d="M 358,88 Q 245,122 145,112 Q 255,100 358,85 Z" fill="url(#wingGradLeft)" opacity="0.75"/>
    </g>

    <!-- Right Wing Crescent Feathers -->
    <g filter="url(#subtleGlow)">
      <path d="M 480,80 Q 620,52 770,78 Q 630,96 480,82 Z" fill="url(#wingGradRight)"/>
      <path d="M 482,80 Q 620,53 766,78" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.55"/>
      <path d="M 495,72 Q 615,32 725,48 Q 605,66 495,75 Z" fill="url(#wingGradRight)" opacity="0.85"/>
      <path d="M 492,88 Q 605,122 705,112 Q 595,100 492,85 Z" fill="url(#wingGradRight)" opacity="0.75"/>
    </g>

    <!-- Central Laser Threads (Bond of Life Beams) -->
    <g>
      <line x1="365" y1="80" x2="60" y2="80" stroke="url(#laserGradLeft)" stroke-width="1.6"/>
      <line x1="365" y1="80" x2="60" y2="80" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.8" stroke-dasharray="40 300">
        <animate attributeName="stroke-dashoffset" values="-300;300" dur="3.6s" repeatCount="indefinite"/>
      </line>
      <polygon points="190,80 193.5,77 197,80 193.5,83" fill="#ff1e42"/>
      <polygon points="90,80 93.5,77 97,80 93.5,83" fill="#ff1e42"/>

      <line x1="485" y1="80" x2="790" y2="80" stroke="url(#laserGradRight)" stroke-width="1.6"/>
      <line x1="485" y1="80" x2="790" y2="80" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.8" stroke-dasharray="40 300">
        <animate attributeName="stroke-dashoffset" values="300;-300" dur="3.6s" repeatCount="indefinite"/>
      </line>
      <polygon points="660,80 656.5,77 653,80 656.5,83" fill="#ff1e42"/>
      <polygon points="760,80 756.5,77 753,80 756.5,83" fill="#ff1e42"/>
    </g>

    <!-- Flanking Harlequin Constellation Stars -->
    <!-- Left Constellation -->
    <g>
      <path d="M 130,48 L 85,78 L 135,112" fill="none" stroke="#ff1e42" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="2 3"/>
      <g transform="translate(130, 48)">
        <polygon points="0,-5 3.5,0 0,5 -3.5,0" fill="#ff3355" filter="url(#subtleGlow)"/>
        <polygon points="0,-2.5 1.8,0 0,2.5 -1.8,0" fill="#ffffff"/>
        <animateTransform attributeName="transform" type="scale" values="1;1.3;1" dur="2.8s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(85, 78)">
        <polygon points="0,-6.5 4.5,0 0,6.5 -4.5,0" fill="#ff1e42" filter="url(#subtleGlow)"/>
        <polygon points="0,-3 2.2,0 0,3 -2.2,0" fill="#ffffff"/>
        <animateTransform attributeName="transform" type="scale" values="1;1.25;1" dur="3.4s" begin="0.7s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(135, 112)">
        <polygon points="0,-5 3.5,0 0,5 -3.5,0" fill="#ff3355" filter="url(#subtleGlow)"/>
        <polygon points="0,-2.5 1.8,0 0,2.5 -1.8,0" fill="#ffffff"/>
        <animateTransform attributeName="transform" type="scale" values="1;1.3;1" dur="3.0s" begin="1.4s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Right Constellation -->
    <g>
      <path d="M 720,48 L 765,78 L 715,112" fill="none" stroke="#ff1e42" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="2 3"/>
      <g transform="translate(720, 48)">
        <polygon points="0,-5 3.5,0 0,5 -3.5,0" fill="#ff3355" filter="url(#subtleGlow)"/>
        <polygon points="0,-2.5 1.8,0 0,2.5 -1.8,0" fill="#ffffff"/>
        <animateTransform attributeName="transform" type="scale" values="1;1.3;1" dur="2.8s" begin="0.4s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(765, 78)">
        <polygon points="0,-6.5 4.5,0 0,6.5 -4.5,0" fill="#ff1e42" filter="url(#subtleGlow)"/>
        <polygon points="0,-3 2.2,0 0,3 -2.2,0" fill="#ffffff"/>
        <animateTransform attributeName="transform" type="scale" values="1;1.25;1" dur="3.4s" begin="1.1s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(715, 112)">
        <polygon points="0,-5 3.5,0 0,5 -3.5,0" fill="#ff3355" filter="url(#subtleGlow)"/>
        <polygon points="0,-2.5 1.8,0 0,2.5 -1.8,0" fill="#ffffff"/>
        <animateTransform attributeName="transform" type="scale" values="1;1.3;1" dur="3.0s" begin="1.8s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- ==================== CENTER BALEMOON & ARLECCHINO EYE (X) ==================== -->
    <g id="center-crest">
      <!-- Outer Celestial Ring (Spinning Clockwise 38s) -->
      <g>
        <circle cx="425" cy="80" r="67" fill="none" stroke="#ff1e42" stroke-width="1" stroke-opacity="0.32" stroke-dasharray="3 8"/>
        <!-- Cardinal & Ordinal Diamond Studs on Ring -->
        <g fill="#ff1e42" opacity="0.8">
          <polygon points="425,11 427.5,13 425,15 422.5,13"/>
          <polygon points="492,80 494,82 492,84 490,82"/>
          <polygon points="425,145 427.5,147 425,149 422.5,147"/>
          <polygon points="358,80 360,82 358,84 356,82"/>
        </g>
        <animateTransform attributeName="transform" type="rotate" from="0 425 80" to="360 425 80" dur="38s" repeatCount="indefinite"/>
      </g>

      <!-- Inner Segmented Occult Dial (Spinning Counter-Clockwise 25s) -->
      <g>
        <circle cx="425" cy="80" r="54" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.55" stroke-dasharray="16 8 3 8"/>
        <animateTransform attributeName="transform" type="rotate" from="360 425 80" to="0 425 80" dur="25s" repeatCount="indefinite"/>
      </g>

      <!-- Vision Brass Trim Arc -->
      <path d="M 390,44 A 50 50 0 0 1 465,112" fill="none" stroke="url(#brassGrad)" stroke-width="1.3" stroke-opacity="0.75" stroke-dasharray="28 8 6 8"/>

      <!-- Dark Balemoon Iris Disc -->
      <circle cx="425" cy="80" r="42" fill="url(#irisDark)" stroke="#520510" stroke-width="1.4"/>

      <!-- Balemoon Crescent Horn Arc -->
      <path d="M 425,39 A 40 40 0 0 1 463,105 A 37 37 0 0 0 407,51 A 40 40 0 0 1 425,39 Z" fill="url(#wingGradRight)" filter="url(#subtleGlow)"/>

      <!-- Inner Limbal Red Ring -->
      <circle cx="425" cy="80" r="36" fill="none" stroke="#ff1e42" stroke-width="1" stroke-opacity="0.65" stroke-dasharray="8 4 2 4"/>

      <!-- ==================== ACCURATE RAZOR-SHARP ARLECCHINO EYE 'X' PUPIL ==================== -->
      <!-- Rotated exactly 45 degrees, 4 razor-sharp stiletto blades with facet lighting -->
      <g transform="translate(425, 80)">
        <g>
          <!-- Outer Crimson Bloom Silhouette -->
          <g transform="rotate(45)" filter="url(#crimsonBloom)">
            <path d="M 0,-4 L 3.5,-11 L 1.5,-31 L 0,-36 L -1.5,-31 L -3.5,-11 Z" fill="#ff1a38"/>
            <path d="M 4,0 L 11,3.5 L 31,1.5 L 36,0 L 31,-1.5 L 11,-3.5 Z" fill="#ff1a38"/>
            <path d="M 0,4 L 3.5,11 L 1.5,31 L 0,36 L -1.5,31 L -3.5,11 Z" fill="#ff1a38"/>
            <path d="M -4,0 L -11,3.5 L -31,1.5 L -36,0 L -31,-1.5 L -11,-3.5 Z" fill="#ff1a38"/>
          </g>

          <!-- Sharp Faceted 3D Blades (Rotated 45 degrees) -->
          <g transform="rotate(45)">
            <!-- Blade 1: Top Arm (along -Y) -->
            <polygon points="0,0 -3.5,-11 -1.5,-31 0,-36 0,0" fill="url(#bladeFacetLight)"/>
            <polygon points="0,0 3.5,-11 1.5,-31 0,-36 0,0" fill="url(#bladeFacetDark)"/>
            <line x1="0" y1="0" x2="0" y2="-36" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.95"/>

            <!-- Blade 2: Right Arm (along +X) -->
            <polygon points="0,0 11,-3.5 31,-1.5 36,0 0,0" fill="url(#bladeFacetLight)"/>
            <polygon points="0,0 11,3.5 31,1.5 36,0 0,0" fill="url(#bladeFacetDark)"/>
            <line x1="0" y1="0" x2="36" y2="0" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.95"/>

            <!-- Blade 3: Bottom Arm (along +Y) -->
            <polygon points="0,0 3.5,11 1.5,31 0,36 0,0" fill="url(#bladeFacetLight)"/>
            <polygon points="0,0 -3.5,11 -1.5,31 0,36 0,0" fill="url(#bladeFacetDark)"/>
            <line x1="0" y1="0" x2="0" y2="36" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.95"/>

            <!-- Blade 4: Left Arm (along -X) -->
            <polygon points="0,0 -11,3.5 -31,1.5 -36,0 0,0" fill="url(#bladeFacetLight)"/>
            <polygon points="0,0 -11,-3.5 -31,-1.5 -36,0 0,0" fill="url(#bladeFacetDark)"/>
            <line x1="0" y1="0" x2="-36" y2="0" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.95"/>

            <!-- Center Diamond Flared Heart -->
            <polygon points="0,-6.5 6.5,0 0,6.5 -6.5,0" fill="#b3001c"/>
            <!-- Piercing Pure White Core Diamond -->
            <polygon points="0,-4 4,0 0,4 -4,0" fill="#ffffff" filter="url(#subtleGlow)"/>
          </g>

          <!-- Smooth Continuous Breathing Pulse -->
          <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="3.2s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Ornate Outer Frame Border & Corner Accents -->
  <rect x="2" y="2" width="846" height="156" rx="10" fill="none" stroke="url(#frameBorder)" stroke-width="1.2"/>
  <g stroke="#ff1e42" stroke-width="1" stroke-opacity="0.65" fill="none">
    <path d="M 10,22 L 10,10 L 22,10"/>
    <path d="M 828,10 L 840,10 L 840,22"/>
    <path d="M 10,138 L 10,150 L 22,150"/>
    <path d="M 828,150 L 840,150 L 840,138"/>
  </g>
  <g fill="#ff1e42" opacity="0.8">
    <polygon points="10,8 12,10 10,12 8,10"/>
    <polygon points="840,8 842,10 840,12 838,10"/>
    <polygon points="10,148 12,150 10,152 8,150"/>
    <polygon points="840,148 842,150 840,152 838,150"/>
  </g>
</svg>
