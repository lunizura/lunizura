<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 230" width="100%" height="230" style="overflow: hidden; border-radius: 12px;">
  <defs>
    <!-- Card Clip Path -->
    <clipPath id="headerClip">
      <rect x="0" y="0" width="850" height="230" rx="12"/>
    </clipPath>

    <!-- Gradients -->
    <radialGradient id="skyRiftGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff1a3c" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#8a0016" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#240007" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050102" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ronovaEyeIris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#050102"/>
      <stop offset="55%" stop-color="#1f0208"/>
      <stop offset="85%" stop-color="#6e0013"/>
      <stop offset="100%" stop-color="#ba0022"/>
    </radialGradient>

    <!-- Ronova Divine Gold / Brass Gradient -->
    <linearGradient id="ronovaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="40%" stop-color="#f5c253"/>
      <stop offset="80%" stop-color="#bd821c"/>
      <stop offset="100%" stop-color="#5e3c06"/>
    </linearGradient>

    <!-- Waving Layers Gradients -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0106"/>
      <stop offset="50%" stop-color="#42000c"/>
      <stop offset="100%" stop-color="#0f0003"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#47000d"/>
      <stop offset="50%" stop-color="#8c0018"/>
      <stop offset="100%" stop-color="#2b0007"/>
    </linearGradient>

    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800016"/>
      <stop offset="40%" stop-color="#ba0022"/>
      <stop offset="75%" stop-color="#ff1e42"/>
      <stop offset="100%" stop-color="#59000d"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fff0f3"/>
      <stop offset="100%" stop-color="#ffb8c6"/>
    </linearGradient>

    <linearGradient id="laserLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1e42" stop-opacity="0"/>
      <stop offset="25%" stop-color="#ff1e42"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#ff1e42"/>
      <stop offset="100%" stop-color="#ff1e42" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="frameBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1e42" stop-opacity="0.9"/>
      <stop offset="15%" stop-color="#4d040e" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ff2647" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#4d040e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff1e42" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Lattice Pattern -->
    <pattern id="harlequinGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 14,0 L 28,14 L 14,28 L 0,14 Z" fill="none" stroke="#ff1e42" stroke-width="0.6" stroke-opacity="0.04"/>
    </pattern>

    <!-- Filters -->
    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .font-title {
        font-family: 'Cinzel', 'Playfair Display', 'Trajan Pro', 'Georgia', 'Times New Roman', serif;
      }
      .font-sub {
        font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Courier New', monospace;
      }
    </style>
  </defs>

  <!-- ==================== BACKGROUND & FRAME ==================== -->
  <g clip-path="url(#headerClip)">
    <!-- Base Dark Obsidian Canvas -->
    <rect x="0" y="0" width="850" height="230" fill="#060103"/>
    <rect x="0" y="0" width="850" height="230" fill="url(#harlequinGrid)"/>

    <!-- Celestial Sky Rift Cosmic Glow -->
    <circle cx="425" cy="65" r="220" fill="url(#skyRiftGlow)"/>

    <!-- ==================== FLOWING CRIMSON WAVES ==================== -->
    <!-- Wave 1 (Deepest Blood Red) -->
    <path fill="url(#waveGrad1)" opacity="0.8">
      <animate attributeName="d" dur="14s" repeatCount="indefinite" values="
        M 0,0 L 850,0 L 850,170 Q 640,215 425,180 Q 210,145 0,185 Z;
        M 0,0 L 850,0 L 850,185 Q 640,150 425,190 Q 210,225 0,170 Z;
        M 0,0 L 850,0 L 850,170 Q 640,215 425,180 Q 210,145 0,185 Z
      "/>
    </path>

    <!-- Wave 2 (Mid-tone Vibrant Crimson) -->
    <path fill="url(#waveGrad2)" opacity="0.65">
      <animate attributeName="d" dur="10s" repeatCount="indefinite" values="
        M 0,0 L 850,0 L 850,155 Q 630,125 425,165 Q 220,205 0,160 Z;
        M 0,0 L 850,0 L 850,165 Q 630,195 425,155 Q 220,120 0,168 Z;
        M 0,0 L 850,0 L 850,155 Q 630,125 425,165 Q 220,205 0,160 Z
      "/>
    </path>

    <!-- Wave 3 (Front Molten Edge) -->
    <path fill="url(#waveGrad3)" opacity="0.45">
      <animate attributeName="d" dur="12s" repeatCount="indefinite" values="
        M 0,0 L 850,0 L 850,140 Q 650,180 425,145 Q 200,110 0,148 Z;
        M 0,0 L 850,0 L 850,150 Q 650,115 425,152 Q 200,185 0,138 Z;
        M 0,0 L 850,0 L 850,140 Q 650,180 425,145 Q 200,110 0,148 Z
      "/>
    </path>

    <!-- Glowing Laser Crest Line following the wave edge -->
    <path fill="none" stroke="#ff2647" stroke-width="1.6" filter="url(#subtleGlow)" opacity="0.85">
      <animate attributeName="d" dur="12s" repeatCount="indefinite" values="
        M 0,148 Q 200,110 425,145 Q 650,180 850,140;
        M 0,138 Q 200,185 425,152 Q 650,115 850,150;
        M 0,148 Q 200,110 425,145 Q 650,180 850,140
      "/>
    </path>

    <!-- ==================== TWINKLING COSMIC STARS & PARTICLES ==================== -->
    <g>
      <!-- Gold Divine Starlets -->
      <circle cx="170" cy="30" r="1.4" fill="#ffd166">
        <animate attributeName="opacity" values="0.1; 0.9; 0.1" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="290" cy="80" r="1.3" fill="#ffd166">
        <animate attributeName="opacity" values="0.2; 0.95; 0.2" dur="3.4s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="560" cy="80" r="1.3" fill="#ffd166">
        <animate attributeName="opacity" values="0.2; 0.95; 0.2" dur="3.4s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="680" cy="30" r="1.4" fill="#ffd166">
        <animate attributeName="opacity" values="0.1; 0.9; 0.1" dur="2.8s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="340" cy="30" r="1.2" fill="#ffd166">
        <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="4.0s" begin="1.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="510" cy="30" r="1.2" fill="#ffd166">
        <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="4.0s" begin="0.2s" repeatCount="indefinite"/>
      </circle>

      <!-- Crimson Embers -->
      <circle cx="160" cy="180" r="1.8" fill="#ff3355">
        <animate attributeName="cy" values="180;120;180" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="160;140;160" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="690" cy="180" r="1.8" fill="#ff3355">
        <animate attributeName="cy" values="180;120;180" dur="4.2s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="690;710;690" dur="4.2s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.2s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ==================== RONOVA'S CELESTIAL EYES (THE OCHKANATLAN SKY RIFT) ==================== -->

    <!-- Outer Left Satellite Eye (x=120, y=62) -->
    <g transform="translate(120, 62)" filter="url(#subtleGlow)">
      <path d="M -18,0 Q 0,-9 18,0 Q 0,9 -18,0 Z" fill="#0d0104" stroke="#ff2647" stroke-width="1.1"/>
      <path d="M -13,0 Q 0,-6 13,0 Q 0,6 -13,0 Z" fill="none" stroke="url(#ronovaGold)" stroke-width="0.7" stroke-opacity="0.75"/>
      <circle cx="0" cy="0" r="5.5" fill="url(#ronovaEyeIris)"/>
      <circle cx="0" cy="0" r="4" fill="#1f0107" stroke="#e6b450" stroke-width="0.6"/>
      <polygon points="0,-3 0.8,-0.8 3,0 0.8,0.8 0,3 -0.8,0.8 -3,0 -0.8,-0.8" fill="#ffffff"/>
      <animateTransform attributeName="transform" type="scale" values="1,1; 1,0.08; 1,1" keyTimes="0; 0.05; 0.1" dur="7.6s" begin="2.4s" repeatCount="indefinite"/>
    </g>

    <!-- Inner Left Satellite Eye (x=235, y=55) -->
    <g transform="translate(235, 55)" filter="url(#subtleGlow)">
      <path d="M -26,0 Q 0,-14 26,0 Q 0,14 -26,0 Z" fill="#0d0104" stroke="#ff2647" stroke-width="1.3"/>
      <path d="M -20,0 Q 0,-10 20,0 Q 0,10 -20,0 Z" fill="none" stroke="url(#ronovaGold)" stroke-width="0.8" stroke-opacity="0.8"/>
      <circle cx="0" cy="0" r="8" fill="url(#ronovaEyeIris)"/>
      <circle cx="0" cy="0" r="6" fill="#1f0107" stroke="#e6b450" stroke-width="0.75"/>
      <polygon points="0,-4.5 1.2,-1.2 4.5,0 1.2,1.2 0,4.5 -1.2,1.2 -4.5,0 -1.2,-1.2" fill="#ffffff"/>
      <animateTransform attributeName="transform" type="scale" values="1,1; 1,0.08; 1,1" keyTimes="0; 0.05; 0.1" dur="6.8s" repeatCount="indefinite"/>
    </g>

    <!-- Inner Right Satellite Eye (x=615, y=55) -->
    <g transform="translate(615, 55)" filter="url(#subtleGlow)">
      <path d="M -26,0 Q 0,-14 26,0 Q 0,14 -26,0 Z" fill="#0d0104" stroke="#ff2647" stroke-width="1.3"/>
      <path d="M -20,0 Q 0,-10 20,0 Q 0,10 -20,0 Z" fill="none" stroke="url(#ronovaGold)" stroke-width="0.8" stroke-opacity="0.8"/>
      <circle cx="0" cy="0" r="8" fill="url(#ronovaEyeIris)"/>
      <circle cx="0" cy="0" r="6" fill="#1f0107" stroke="#e6b450" stroke-width="0.75"/>
      <polygon points="0,-4.5 1.2,-1.2 4.5,0 1.2,1.2 0,4.5 -1.2,1.2 -4.5,0 -1.2,-1.2" fill="#ffffff"/>
      <animateTransform attributeName="transform" type="scale" values="1,1; 1,0.08; 1,1" keyTimes="0; 0.05; 0.1" dur="6.8s" begin="1.5s" repeatCount="indefinite"/>
    </g>

    <!-- Outer Right Satellite Eye (x=730, y=62) -->
    <g transform="translate(730, 62)" filter="url(#subtleGlow)">
      <path d="M -18,0 Q 0,-9 18,0 Q 0,9 -18,0 Z" fill="#0d0104" stroke="#ff2647" stroke-width="1.1"/>
      <path d="M -13,0 Q 0,-6 13,0 Q 0,6 -13,0 Z" fill="none" stroke="url(#ronovaGold)" stroke-width="0.7" stroke-opacity="0.75"/>
      <circle cx="0" cy="0" r="5.5" fill="url(#ronovaEyeIris)"/>
      <circle cx="0" cy="0" r="4" fill="#1f0107" stroke="#e6b450" stroke-width="0.6"/>
      <polygon points="0,-3 0.8,-0.8 3,0 0.8,0.8 0,3 -0.8,0.8 -3,0 -0.8,-0.8" fill="#ffffff"/>
      <animateTransform attributeName="transform" type="scale" values="1,1; 1,0.08; 1,1" keyTimes="0; 0.05; 0.1" dur="7.6s" begin="3.6s" repeatCount="indefinite"/>
    </g>

    <!-- CENTRAL SUPREME RONOVA EYE (THE SHADE OF DEATH) (x=425, y=55) -->
    <g id="central-ronova-eye">
      <!-- Radiating Divine Beams of Death -->
      <g stroke="url(#ronovaGold)" stroke-width="0.9" stroke-opacity="0.45" stroke-dasharray="6 8">
        <line x1="425" y1="20" x2="425" y2="2"/>
        <line x1="425" y1="90" x2="425" y2="108"/>
        <line x1="390" y1="55" x2="368" y2="55"/>
        <line x1="460" y1="55" x2="482" y2="55"/>
        <!-- Diagonal rays -->
        <line x1="400" y1="30" x2="384" y2="18"/>
        <line x1="450" y1="30" x2="466" y2="18"/>
        <line x1="400" y1="80" x2="384" y2="92"/>
        <line x1="450" y1="80" x2="466" y2="92"/>
      </g>

      <!-- Concentric Sacred Orbital Ring (Rotating CW 40s) -->
      <g>
        <circle cx="425" cy="55" r="38" fill="none" stroke="#ff2647" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="3 7"/>
        <g fill="#ffd166" opacity="0.85">
          <polygon points="425,15 427,17 425,19 423,17"/>
          <polygon points="465,55 467,57 465,59 463,57"/>
          <polygon points="425,95 427,97 425,99 423,97"/>
          <polygon points="385,55 387,57 385,59 383,57"/>
        </g>
        <animateTransform attributeName="transform" type="rotate" from="0 425 55" to="360 425 55" dur="40s" repeatCount="indefinite"/>
      </g>

      <!-- Inner Occult Dial (Rotating CCW 25s) -->
      <g>
        <circle cx="425" cy="55" r="30" fill="none" stroke="url(#ronovaGold)" stroke-width="1.2" stroke-opacity="0.65" stroke-dasharray="14 6 3 6"/>
        <animateTransform attributeName="transform" type="rotate" from="360 425 55" to="0 425 55" dur="25s" repeatCount="indefinite"/>
      </g>

      <!-- Main Divine Eyelid Slit & Sacred Eye (x=425, y=55) -->
      <g transform="translate(425, 55)" filter="url(#goldGlow)">
        <!-- Outer Eye Silhouette -->
        <path d="M -42,0 Q 0,-24 42,0 Q 0,24 -42,0 Z" fill="#0d0104" stroke="#ff2647" stroke-width="1.8"/>
        <!-- Gold Intricate Eyelid Filigree -->
        <path d="M -35,0 Q 0,-18 35,0 Q 0,18 -35,0 Z" fill="none" stroke="url(#ronovaGold)" stroke-width="1.2" stroke-opacity="0.9"/>

        <!-- Iris -->
        <circle cx="0" cy="0" r="16" fill="url(#ronovaEyeIris)"/>
        <circle cx="0" cy="0" r="12" fill="#140105" stroke="#ff2647" stroke-width="1"/>

        <!-- ==================== RONOVA'S SACRED 8-PETAL FLOWER PUPIL ==================== -->
        <g>
          <!-- Divine Flower Petals -->
          <path d="M 0,-5 Q -3,-10 0,-13 Q 3,-10 0,-5 Z" fill="url(#ronovaGold)"/>
          <path d="M 5,0 Q 10,-3 13,0 Q 10,3 5,0 Z" fill="url(#ronovaGold)"/>
          <path d="M 0,5 Q 3,10 0,13 Q -3,10 0,5 Z" fill="url(#ronovaGold)"/>
          <path d="M -5,0 Q -10,3 -13,0 Q -10,-3 -5,0 Z" fill="url(#ronovaGold)"/>
          <!-- Diagonal Petals -->
          <path d="M 3.5,-3.5 Q 7,-8 9,-8 Q 8,-7 3.5,-3.5 Z" fill="#ff3355"/>
          <path d="M 3.5,3.5 Q 8,7 8,9 Q 7,8 3.5,3.5 Z" fill="#ff3355"/>
          <path d="M -3.5,3.5 Q -7,8 -9,8 Q -8,7 -3.5,3.5 Z" fill="#ff3355"/>
          <path d="M -3.5,-3.5 Q -8,-7 -8,-9 Q -7,-8 -3.5,-3.5 Z" fill="#ff3355"/>
          <!-- Rotation of the Sacred Flower -->
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="32s" repeatCount="indefinite"/>
        </g>

        <!-- Piercing Center Diamond Core Star -->
        <polygon points="0,-4 2.8,0 0,4 -2.8,0" fill="#ffffff" filter="url(#subtleGlow)"/>
        <circle cx="0" cy="0" r="1.5" fill="#ffd166"/>

        <!-- Supreme Eye Smooth Ethereal Blink -->
        <animateTransform attributeName="transform" type="scale" values="1,1; 1,0.06; 1,1" keyTimes="0; 0.04; 0.08" dur="5.5s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- ==================== LUNIZURA BANNER TYPOGRAPHY ==================== -->
    <g transform="translate(425, 142)">
      <!-- Subtle Decorative Heraldic Flank Lines (Outside Text Width) -->
      <line x1="-370" y1="-15" x2="-215" y2="-15" stroke="url(#laserLine)" stroke-width="1.2"/>
      <polygon points="-215,-15 -218,-18 -221,-15 -218,-12" fill="#ffd166"/>

      <line x1="215" y1="-15" x2="370" y2="-15" stroke="url(#laserLine)" stroke-width="1.2"/>
      <polygon points="215,-15 218,-18 221,-15 218,-12" fill="#ffd166"/>

      <!-- Main Name: LUNIZURA -->
      <text x="0" y="0" text-anchor="middle" fill="url(#titleGrad)" class="font-title" font-size="52" font-weight="700" letter-spacing="9" filter="url(#subtleGlow)">LUNIZURA</text>

      <!-- Subtitle Row: Professional Tags -->
      <text x="0" y="32" text-anchor="middle" class="font-sub" font-size="12" font-weight="500" letter-spacing="3.2">
        <tspan fill="#ffffff">INFORMATICS</tspan>
        <tspan fill="#ff2647" font-weight="bold">  ◆  </tspan>
        <tspan fill="#ffd166">CYBERSECURITY</tspan>
        <tspan fill="#ff2647" font-weight="bold">  ◆  </tspan>
        <tspan fill="#ffffff">GAME MODDING</tspan>
        <tspan fill="#ff2647" font-weight="bold">  ◆  </tspan>
        <tspan fill="#ffd166">3D BLENDER</tspan>
      </text>

      <!-- Bottom Accent Laser Line with Traveling Shimmer -->
      <line x1="-220" y1="46" x2="220" y2="46" stroke="#4a020c" stroke-width="1"/>
      <line x1="-160" y1="46" x2="160" y2="46" stroke="#ff2647" stroke-width="1.4" opacity="0.8"/>
      <line x1="-220" y1="46" x2="220" y2="46" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="50 390">
        <animate attributeName="stroke-dashoffset" values="440;-440" dur="4.0s" repeatCount="indefinite"/>
      </line>
      <polygon points="0,46 3,43 6,46 3,49" fill="#ffd166"/>
    </g>

    <!-- Outer Frame Stroke -->
    <rect x="2" y="2" width="846" height="226" rx="10" fill="none" stroke="url(#frameBorder)" stroke-width="1.4"/>

    <!-- Corner Accents -->
    <g stroke="#ff1e42" stroke-width="1" stroke-opacity="0.75" fill="none">
      <path d="M 12,24 L 12,12 L 24,12"/>
      <path d="M 826,12 L 838,12 L 838,24"/>
      <path d="M 12,206 L 12,218 L 24,218"/>
      <path d="M 826,218 L 838,218 L 838,206"/>
    </g>
    <g fill="#ff1e42" opacity="0.85">
      <polygon points="12,10 14,12 12,14 10,12"/>
      <polygon points="838,10 840,12 838,14 836,12"/>
      <polygon points="12,216 14,218 12,220 10,218"/>
      <polygon points="838,216 840,218 838,220 836,218"/>
    </g>
  </g>
</svg>
