<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 84" width="100%" height="100%">
  <defs>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d040d" stop-opacity="0.46" />
      <stop offset="50%" stop-color="#210106" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#120003" stop-opacity="0.50" />
    </linearGradient>
    <linearGradient id="rainStreak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1e42" stop-opacity="0" />
      <stop offset="70%" stop-color="#ff2e52" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>
    <pattern id="crimsonGrid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M 45 0 L 0 0 0 45" fill="none" stroke="#ff1e42" stroke-width="0.6" stroke-opacity="0.08" />
      <circle cx="45" cy="45" r="0.9" fill="#ff2e52" fill-opacity="0.16" />
    </pattern>
    <filter id="pillarBlur" x="-40%" y="-20%" width="180%" height="140%">
      <feGaussianBlur stdDeviation="14 10" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="900" height="84" fill="#240206" />
  <rect width="900" height="84" fill="url(#crimsonGrid)" />

  <g filter="url(#pillarBlur)">
    <rect x="415" y="-10" width="70" height="104" fill="#cc0022" opacity="0.32" />
    <rect x="255" y="-10" width="48" height="104" fill="#b8001f" opacity="0.25" />
    <rect x="597" y="-10" width="48" height="104" fill="#b8001f" opacity="0.25" />
    <rect x="102" y="-10" width="34" height="104" fill="#b8001f" opacity="0.19" />
    <rect x="764" y="-10" width="34" height="104" fill="#b8001f" opacity="0.19" />
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M 115,0 Q 122,42 115,84" stroke="#660010" stroke-width="2" opacity="0.5" />
    <path d="M 260,0 Q 252,42 260,84" stroke="#800016" stroke-width="3" opacity="0.55" />
    <path d="M 260,0 Q 252,42 260,84" stroke="#ff2e52" stroke-width="1.6" stroke-dasharray="30 60" filter="url(#glow)" opacity="0.85">
      <animate attributeName="stroke-dashoffset" from="90" to="0" dur="1.4s" begin="0.2s" repeatCount="indefinite" />
    </path>
    <path d="M 450,0 Q 456,42 450,84" stroke="#9e001a" stroke-width="2.2" opacity="0.5" />
    <path d="M 450,0 Q 456,42 450,84" stroke="#ffffff" stroke-width="1.4" stroke-dasharray="25 65" filter="url(#glow)" opacity="0.8">
      <animate attributeName="stroke-dashoffset" from="90" to="0" dur="1.1s" begin="0.2s" repeatCount="indefinite" />
    </path>
    <path d="M 640,0 Q 648,42 640,84" stroke="#800016" stroke-width="3" opacity="0.55" />
    <path d="M 640,0 Q 648,42 640,84" stroke="#ff2e52" stroke-width="1.6" stroke-dasharray="30 60" filter="url(#glow)" opacity="0.85">
      <animate attributeName="stroke-dashoffset" from="90" to="0" dur="1.4s" begin="0.6s" repeatCount="indefinite" />
    </path>
    <path d="M 785,0 Q 778,42 785,84" stroke="#660010" stroke-width="2" opacity="0.5" />
  </g>

  <g filter="url(#glow)">
    <rect x="248" y="-50" width="1.6" height="45" fill="url(#rainStreak)">
      <animate attributeName="y" values="-50;90" dur="1.0s" begin="0.2s" repeatCount="indefinite" />
    </rect>
    <rect x="482" y="-50" width="1.8" height="45" fill="url(#rainStreak)">
      <animate attributeName="y" values="-50;90" dur="1.1s" begin="0.5s" repeatCount="indefinite" />
    </rect>
    <rect x="728" y="-50" width="1.6" height="45" fill="url(#rainStreak)">
      <animate attributeName="y" values="-50;90" dur="1.3s" begin="0.1s" repeatCount="indefinite" />
    </rect>
  </g>

  <g transform="translate(30, 6)">
    <rect width="840" height="72" rx="6" fill="url(#glassCard)" stroke="#ff2e52" stroke-width="1.3" stroke-opacity="0.75" />
    <rect x="0" y="0" width="6" height="72" rx="3" fill="#ff1e42" filter="url(#glow)" />

    <polygon points="24,18 31,24 24,30 17,24" fill="#ff2e52" filter="url(#glow)" />
    <text x="40" y="28" font-family="'JetBrains Mono', 'Consolas', 'Segoe UI', sans-serif" font-size="14.5" font-weight="800" fill="#ffffff" letter-spacing="0.8">
      lunizura / <tspan fill="#ff4d6d">ugm-prodi-directory</tspan>
    </text>

    <text x="40" y="51" font-family="'Segoe UI', 'Inter', sans-serif" font-size="12" fill="#ffe0e6">
      Bilingual interactive directory of 74 Universitas Gadjah Mada programs with real-time quota calculations and modal deep-dives.
    </text>

    <g transform="translate(565, 12)" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="10" font-weight="700">
      <rect x="0" y="0" width="172" height="22" rx="4" fill="#590010" fill-opacity="0.65" stroke="#ff2e52" stroke-width="1" />
      <text x="86" y="15" text-anchor="middle" fill="#ffe6eb">JS &#8226; HTML5 &#8226; PY &#8226; CI/CD</text>

      <rect x="182" y="0" width="80" height="22" rx="4" fill="#ff1e42" />
      <text x="222" y="15" text-anchor="middle" fill="#ffffff" font-weight="800">OPEN &#10140;</text>
    </g>
  </g>

  <line x1="1" y1="0" x2="1" y2="84" stroke="#ff1a3c" stroke-width="2" opacity="0.4" />
  <line x1="899" y1="0" x2="899" y2="84" stroke="#ff1a3c" stroke-width="2" opacity="0.4" />
</svg>
