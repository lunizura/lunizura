<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="220">
  <defs>
    <!-- Gradients -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1a40" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#b3001e" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#4d000b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a0305" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wingGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#400006"/>
      <stop offset="40%" stop-color="#b3001b"/>
      <stop offset="80%" stop-color="#ff1a38"/>
      <stop offset="100%" stop-color="#ff667a"/>
    </linearGradient>
    <linearGradient id="wingGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a0003"/>
      <stop offset="50%" stop-color="#990014"/>
      <stop offset="100%" stop-color="#ff334b"/>
    </linearGradient>
    <linearGradient id="scytheGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d63"/>
      <stop offset="50%" stop-color="#b3001e"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bgBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a38" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#4d000d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff1a38" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filters & Glow -->
    <filter id="crimsonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes glideHover {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(-1.5deg); }
      }
      @keyframes wingBeat {
        0%, 100% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(-6deg) scale(1.04, 0.96); }
      }
      @keyframes wingSecondary {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-9deg); }
      }
      @keyframes coatWave {
        0%, 100% { transform: skewX(0deg) rotate(0deg); }
        50% { transform: skewX(-4deg) rotate(2deg); }
      }
      @keyframes moonPulse {
        0%, 100% { r: 52px; opacity: 0.85; }
        50% { r: 56px; opacity: 1; }
      }
      @keyframes crossDrift {
        0% { transform: translate(0, 0) rotate(0deg); opacity: 0.8; }
        100% { transform: translate(-120px, 35px) rotate(180deg); opacity: 0; }
      }
      @keyframes emberFloat {
        0% { transform: translate(0, 0); opacity: 0.9; }
        100% { transform: translate(-150px, -20px); opacity: 0; }
      }
      .flier { animation: glideHover 3.6s ease-in-out infinite; }
      .wing-main { transform-origin: 390px 105px; animation: wingBeat 2.4s ease-in-out infinite; }
      .wing-sub { transform-origin: 390px 110px; animation: wingSecondary 2.4s ease-in-out infinite; }
      .coat-tail { transform-origin: 430px 125px; animation: coatWave 1.8s ease-in-out infinite; }
      .moon-anim { animation: moonPulse 4s ease-in-out infinite; }
      .ember1 { animation: emberFloat 2.2s linear infinite; }
      .ember2 { animation: emberFloat 1.8s linear infinite 0.5s; }
      .ember3 { animation: emberFloat 2.6s linear infinite 1.1s; }
      .cross1 { animation: crossDrift 3s linear infinite; }
      .cross2 { animation: crossDrift 2.5s linear infinite 1.2s; }
      .mono { font-family: 'Consolas', 'Courier New', 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect x="2" y="2" width="846" height="216" rx="12" fill="#070204" stroke="url(#bgBorder)" stroke-width="1.5"/>

  <!-- Subtle Crimson Nebula Backdrop -->
  <rect x="3" y="3" width="844" height="214" rx="11" fill="url(#moonGlow)" opacity="0.65"/>
  
  <!-- Silhouette Architecture Backdrop (Fontaine Gothic Spires) -->
  <g opacity="0.22" fill="#1a0005">
    <polygon points="40,214 70,120 75,120 105,214"/>
    <polygon points="120,214 135,90 140,90 155,214"/>
    <polygon points="180,214 210,140 240,214"/>
    <polygon points="680,214 705,110 710,110 735,214"/>
    <polygon points="760,214 785,80 790,80 815,214"/>
  </g>

  <!-- The Balemoon (Blood Moon) -->
  <g transform="translate(190, 95)">
    <circle cx="0" cy="0" r="80" fill="url(#moonGlow)" opacity="0.5"/>
    <circle cx="0" cy="0" r="52" fill="#1a0206" stroke="#ff1a38" stroke-width="2.5" filter="url(#crimsonGlow)" class="moon-anim"/>
    <!-- Eclipse Inner Crescent -->
    <path d="M -30,-40 A 50 50 0 0 1 30,40 A 46 46 0 0 0 -30,-40 Z" fill="#ff2642" opacity="0.75"/>
    <!-- Gothic Moon Ring -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#ff1a38" stroke-width="0.75" stroke-dasharray="6 4" stroke-opacity="0.6"/>
  </g>

  <!-- Animated Flying Particles (Embers and Fatui Crosses) -->
  <g>
    <!-- Cross 1 -->
    <g class="cross1" transform="translate(510, 85)">
      <path d="M -6,-2 L -2,-2 L -2,-6 L 2,-6 L 2,-2 L 6,-2 L 6,2 L 2,2 L 2,6 L -2,6 L -2,2 L -6,2 Z" fill="#ff334b"/>
    </g>
    <!-- Cross 2 -->
    <g class="cross2" transform="translate(560, 130)">
      <path d="M -4,-1.5 L -1.5,-1.5 L -1.5,-4 L 1.5,-4 L 1.5,-1.5 L 4,-1.5 L 4,1.5 L 1.5,1.5 L 1.5,4 L -1.5,4 L -1.5,1.5 L -4,1.5 Z" fill="#ff4d63" opacity="0.8"/>
    </g>
    <!-- Embers -->
    <circle cx="480" cy="110" r="2.5" fill="#ff4d63" class="ember1"/>
    <circle cx="520" cy="70" r="2" fill="#ff1a38" class="ember2"/>
    <circle cx="450" cy="145" r="3" fill="#ff8093" class="ember3"/>
    <circle cx="590" cy="105" r="1.8" fill="#ff1a38" class="ember1"/>
  </g>

  <!-- ARLECCHINO CHARGED FLIGHT AVATAR -->
  <g class="flier">

    <!-- 1. The Wing of Balemoon (Primary Giant Crimson Wing) -->
    <!-- Wing Sub-feathers (Back layer) -->
    <g class="wing-sub" filter="url(#crimsonGlow)">
      <!-- Feather blade 4 (lower) -->
      <path d="M 390,110 Q 320,135 240,115 Q 310,95 390,105 Z" fill="url(#wingGrad2)" opacity="0.85"/>
      <!-- Feather blade 5 (lowest) -->
      <path d="M 390,115 Q 300,165 210,140 Q 285,120 390,110 Z" fill="url(#wingGrad2)" opacity="0.75"/>
    </g>

    <!-- Main Wing Blades (Front Layer) -->
    <g class="wing-main" filter="url(#crimsonGlow)">
      <!-- High Blade 1 (Apex arch) -->
      <path d="M 390,105 Q 360,40 260,15 Q 320,55 390,105 Z" fill="url(#wingGrad1)"/>
      <!-- Mid Blade 2 (Longest primary feather) -->
      <path d="M 390,105 Q 330,60 210,40 Q 290,75 390,105 Z" fill="url(#wingGrad1)"/>
      <!-- Mid Blade 3 -->
      <path d="M 390,108 Q 310,90 190,80 Q 275,100 390,108 Z" fill="url(#wingGrad1)"/>
      <!-- Glowing Wing Spine Line -->
      <path d="M 390,106 Q 310,65 200,45" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
      <!-- Wing Energy Crystals -->
      <polygon points="260,15 264,22 258,25 254,18" fill="#ffffff"/>
      <polygon points="210,40 215,48 208,50 204,43" fill="#ffffff"/>
      <polygon points="190,80 196,87 189,90 185,83" fill="#ffffff"/>
    </g>

    <!-- 2. Arlecchino Body & Scythe -->
    <g transform="translate(390, 80)">
      <!-- Flowing Coat Tails (Behind body) -->
      <g class="coat-tail">
        <path d="M 20,45 Q 60,65 95,75 Q 55,50 25,35 Z" fill="#111827"/>
        <path d="M 22,48 Q 62,68 93,73" fill="none" stroke="#b3001e" stroke-width="2"/>
        <!-- Crimson Inner Coat Lining -->
        <path d="M 18,40 Q 50,55 75,60 Q 45,45 20,32 Z" fill="#990014" opacity="0.9"/>
      </g>

      <!-- Crimson Scythe (Crimson Moon Semblance) -->
      <g transform="rotate(-20, 20, 30)">
        <!-- Scythe Shaft -->
        <line x1="-30" y1="75" x2="55" y2="-15" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
        <line x1="-30" y1="75" x2="55" y2="-15" stroke="#dc2626" stroke-width="1" stroke-opacity="0.8"/>
        <!-- Giant Crescent Scythe Blade -->
        <path d="M 55,-15 Q 105,-45 130,-15 Q 95,-10 65,-5 Z" fill="url(#scytheGrad)" filter="url(#crimsonGlow)"/>
        <!-- Scythe Inner Glow Curve -->
        <path d="M 58,-14 Q 100,-40 126,-15" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
        <!-- Scythe Ornate Ring -->
        <circle cx="55" cy="-15" r="5" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
      </g>

      <!-- Main Body Silhouette (Harbinger Uniform) -->
      <!-- Legs & Boots (Hovering pose angled backward) -->
      <path d="M 15,45 L 35,70 L 45,68 L 22,42 Z" fill="#0f172a"/>
      <path d="M 8,45 L 25,75 L 35,73 L 15,40 Z" fill="#1e293b"/>
      <!-- Torso / Waistcoat (White & Black) -->
      <path d="M 5,20 L 22,20 L 20,45 L 5,45 Z" fill="#f8fafc"/>
      <path d="M 8,20 L 15,45 L 5,45 Z" fill="#0f172a"/>
      <circle cx="12" cy="30" r="2" fill="#dc2626"/>
      <!-- Neck / Collar -->
      <polygon points="7,16 16,16 14,22 9,22" fill="#0f172a" stroke="#dc2626" stroke-width="0.5"/>

      <!-- Head & Hair (Arlecchino Distinctive Black & White Style) -->
      <!-- Head Base -->
      <circle cx="14" cy="10" r="8" fill="#fed7aa"/>
      <!-- Hair (Platinum White with Black Under-streaks) -->
      <path d="M 7,8 Q 5,-4 18,-3 Q 26,-2 25,12 Q 21,8 18,12 Q 13,4 7,8 Z" fill="#ffffff"/>
      <!-- Black Hair Streak (Signature) -->
      <path d="M 10,2 Q 16,-1 20,6 Q 16,4 12,5 Z" fill="#0f172a"/>
      <path d="M 22,5 Q 26,10 24,18 Q 20,12 21,6 Z" fill="#0f172a"/>
      <!-- Hair Ponytail / Ribbon streaming back -->
      <path d="M 22,6 Q 42,4 58,0 Q 40,10 22,12 Z" fill="#ffffff"/>
      <path d="M 22,8 Q 38,8 52,4" fill="none" stroke="#0f172a" stroke-width="1.5"/>
      <!-- Crimson Eye Glint -->
      <polygon points="10,10 12,8 14,10 12,12" fill="#dc2626" filter="url(#crimsonGlow)"/>
    </g>
  </g>

  <!-- Overlay UI Header & Labels -->
  <g transform="translate(30, 32)">
    <rect x="0" y="0" width="135" height="20" rx="4" fill="#1a0005" stroke="#ff1a38" stroke-width="1"/>
    <text x="8" y="14" fill="#ff4d63" class="mono" font-size="10" font-weight="bold" letter-spacing="1.5">THE KNAVE // IV</text>
  </g>

  <g transform="translate(30, 195)">
    <text x="0" y="0" fill="#cbd5e1" class="mono" font-size="11" font-weight="bold" letter-spacing="1">ARLECCHINO</text>
    <text x="95" y="0" fill="#ff4d63" class="mono" font-size="10"> // WING OF BALEMOON &amp; CRIMSON FLIGHT</text>
  </g>

  <g transform="translate(640, 195)">
    <text x="0" y="0" fill="#64748b" class="mono" font-size="9" letter-spacing="1">FATUI HARBINGER #4</text>
  </g>
</svg>
