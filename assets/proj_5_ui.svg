<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 84" width="100%" height="100%">
  <defs>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d040d" stop-opacity="0.46" />
      <stop offset="50%" stop-color="#210106" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#120003" stop-opacity="0.50" />
    </linearGradient>
    <linearGradient id="pillarH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cc0022" stop-opacity="0" />
      <stop offset="50%" stop-color="#ff1e42" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#cc0022" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="rainStreak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1e42" stop-opacity="0" />
      <stop offset="70%" stop-color="#ff2e52" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>
    <pattern id="crimsonGrid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M 45 0 L 0 0 0 45" fill="none" stroke="#ff1e42" stroke-width="0.6" stroke-opacity="0.08" />
      <circle cx="45" cy="45" r="0.9" fill="#ff2e52" fill-opacity="0.16" />
    </pattern>
    <g id="fastDrop">
      <rect x="-1.8" y="0" width="5.2" height="45" fill="url(#rainStreak)" opacity="0.3" />
      <rect x="0" y="0" width="1.6" height="45" fill="url(#rainStreak)" />
    </g>
  </defs>

  <rect width="900" height="84" fill="#240206" />
  <rect width="900" height="84" fill="url(#crimsonGrid)" />

  <rect x="385" y="0" width="130" height="84" fill="url(#pillarH)" />
  <rect x="231" y="0" width="96" height="84" fill="url(#pillarH)" opacity="0.75" />
  <rect x="573" y="0" width="96" height="84" fill="url(#pillarH)" opacity="0.75" />
  <rect x="83" y="0" width="72" height="84" fill="url(#pillarH)" opacity="0.55" />
  <rect x="745" y="0" width="72" height="84" fill="url(#pillarH)" opacity="0.55" />

  <g fill="none" stroke-linecap="round">
    <path d="M 115,0 Q 108,42 115,84" stroke="#660010" stroke-width="2" opacity="0.5" />
    <path d="M 260,0 Q 268,42 260,84" stroke="#800016" stroke-width="3" opacity="0.55" />
    <path d="M 260,0 Q 268,42 260,84" stroke="#ff1a3c" stroke-width="5.5" stroke-dasharray="30 60" opacity="0.28">
      <animate attributeName="stroke-dashoffset" from="90" to="0" dur="1.4s" begin="0.8s" repeatCount="indefinite" />
    </path>
    <path d="M 260,0 Q 268,42 260,84" stroke="#ff4d6d" stroke-width="1.6" stroke-dasharray="30 60" opacity="0.9">
      <animate attributeName="stroke-dashoffset" from="90" to="0" dur="1.4s" begin="0.8s" repeatCount="indefinite" />
    </path>
    <path d="M 450,0 Q 444,42 450,84" stroke="#9e001a" stroke-width="2.2" opacity="0.5" />
    <path d="M 450,0 Q 444,42 450,84" stroke="#ff2e52" stroke-width="5" stroke-dasharray="25 65" opacity="0.3">
      <animate attributeName="stroke-dashoffset" from="90" to="0" dur="1.1s" begin="0.8s" repeatCount="indefinite" />
    </path>
    <path d="M 450,0 Q 444,42 450,84" stroke="#ffffff" stroke-width="1.4" stroke-dasharray="25 65" opacity="0.88">
      <animate attributeName="stroke-dashoffset" from="90" to="0" dur="1.1s" begin="0.8s" repeatCount="indefinite" />
    </path>
    <path d="M 640,0 Q 632,42 640,84" stroke="#800016" stroke-width="3" opacity="0.55" />
    <path d="M 640,0 Q 632,42 640,84" stroke="#ff1a3c" stroke-width="5.5" stroke-dasharray="30 60" opacity="0.28">
      <animate attributeName="stroke-dashoffset" from="90" to="0" dur="1.4s" begin="1.2s" repeatCount="indefinite" />
    </path>
    <path d="M 640,0 Q 632,42 640,84" stroke="#ff4d6d" stroke-width="1.6" stroke-dasharray="30 60" opacity="0.9">
      <animate attributeName="stroke-dashoffset" from="90" to="0" dur="1.4s" begin="1.2s" repeatCount="indefinite" />
    </path>
    <path d="M 785,0 Q 792,42 785,84" stroke="#660010" stroke-width="2" opacity="0.5" />
  </g>

  <g>
    <use href="#fastDrop" x="248" y="-50"><animate attributeName="y" values="-50;90" dur="0.95s" begin="0.5s" repeatCount="indefinite" /></use>
    <use href="#fastDrop" x="482" y="-50"><animate attributeName="y" values="-50;90" dur="1.1s" begin="0.2s" repeatCount="indefinite" /></use>
    <use href="#fastDrop" x="652" y="-50"><animate attributeName="y" values="-50;90" dur="1.25s" begin="0.4s" repeatCount="indefinite" /></use>
  </g>

  <g transform="translate(30, 6)">
    <rect width="840" height="72" rx="6" fill="url(#glassCard)" stroke="#ff2e52" stroke-width="1.3" stroke-opacity="0.75" />
    <rect x="-1" y="0" width="8" height="72" rx="4" fill="#ff1e42" opacity="0.35" />
    <rect x="0" y="0" width="6" height="72" rx="3" fill="#ff1e42" />

    <polygon points="24,18 31,24 24,30 17,24" fill="#ff2e52" />
    <text x="40" y="28" font-family="'JetBrains Mono', 'Consolas', 'Segoe UI', sans-serif" font-size="14.5" font-weight="800" fill="#ffffff" letter-spacing="0.8">
      lunizura / <tspan fill="#ff4d6d">ui-prodi-directory</tspan>
    </text>

    <text x="40" y="51" font-family="'Segoe UI', 'Inter', sans-serif" font-size="12" fill="#ffe0e6">
      Universitas Indonesia undergraduate program directory with admission metrics and bilingual academic guides.
    </text>

    <g transform="translate(565, 12)" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="10" font-weight="700">
      <rect x="0" y="0" width="172" height="22" rx="4" fill="#590010" fill-opacity="0.65" stroke="#ff2e52" stroke-width="1" />
      <text x="86" y="15" text-anchor="middle" fill="#ffe6eb">JS &#8226; PYTHON TEST SUITE</text>

      <rect x="182" y="0" width="80" height="22" rx="4" fill="#ff1e42" />
      <text x="222" y="15" text-anchor="middle" fill="#ffffff" font-weight="800">OPEN &#10140;</text>
    </g>
  </g>

  <line x1="1" y1="0" x2="1" y2="84" stroke="#ff1a3c" stroke-width="2" opacity="0.4" />
  <line x1="899" y1="0" x2="899" y2="84" stroke="#ff1a3c" stroke-width="2" opacity="0.4" />
</svg>
