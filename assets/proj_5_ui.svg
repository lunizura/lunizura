    </text>

    <g transform="translate(565, 12)" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="10" font-weight="700">
      <rect x="0" y="0" width="172" height="22" rx="4" fill="#590010" stroke="#ff2e52" stroke-width="1" />
