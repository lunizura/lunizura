    <rect x="0" y="0" width="6" height="72" rx="3" fill="#ff1e42" filter="url(#p5Glow)" />

    <polygon points="24,18 31,24 24,30 17,24" fill="#ff2e52" filter="url(#p5Glow)" />
    <text x="40" y="28" font-family="'JetBrains Mono', 'Consolas', 'Segoe UI', sans-serif" font-size="14.5" font-weight="800" fill="#ffffff" letter-spacing="0.8">
      lunizura / <tspan fill="#ff4d6d">ui-prodi-directory</tspan>
    </text>

    <text x="40" y="51" font-family="'Segoe UI', 'Inter', sans-serif" font-size="12" fill="#ffd6de">
