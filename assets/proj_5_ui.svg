<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 84" width="100%" height="100%">
  <defs>
    <linearGradient id="p5Bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#210206" />
      <stop offset="50%" stop-color="#33030a" />
      <stop offset="100%" stop-color="#210206" />
    </linearGradient>
    <linearGradient id="p5Card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450510" />
      <stop offset="60%" stop-color="#290208" />
      <stop offset="100%" stop-color="#1a0104" />
    </linearGradient>
    <filter id="p5Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="900" height="84" fill="url(#p5Bg)" />
  <g transform="translate(30, 6)">
